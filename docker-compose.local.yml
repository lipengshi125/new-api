# New-API Local Development Docker Compose
# 本地构建配置 - 包含最新的 R2 功能
#
# 使用方法:
#   docker-compose -f docker-compose.local.yml up -d --build

version: '3.4'

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-api-local
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 数据库配置 - PostgreSQL
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api

      # Redis 配置
      - REDIS_CONN_STRING=redis://:123456@redis:6379

      # 时区
      - TZ=Asia/Shanghai

      # 功能开关
      - GLOBAL_API_RATE_LIMIT_ENABLE=false
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=false
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true

      # 节点名称
      - NODE_NAME=new-api-local

      # 可选：如果需要外部访问，取消注释下面这行并修改为你的域名
      # - SERVER_ADDRESS=http://localhost:3000

    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis-local
    restart: always
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres-local
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data_local:

networks:
  new-api-network:
    driver: bridge
